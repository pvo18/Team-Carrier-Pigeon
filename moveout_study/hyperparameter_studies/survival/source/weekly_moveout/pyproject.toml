[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weekly-moveout"
version = "0.2.0"
description = "Reproducible weekly move-out and survival model comparison"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "joblib>=1.3", "PyYAML>=6", "pyarrow>=14", "lifelines>=0.30", "torch>=2.2", "pycox>=0.3", "torchtuples>=0.2", "matplotlib>=3.7", "tabulate>=0.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
moveout = "moveout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
